name: Build SquadVoice Android APK & iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get dependencies & patch agora_rtc_engine compileSdk to 36
        run: |
          rm -f test/widget_test.dart
          flutter pub get
          find "$HOME/.pub-cache" -name "build.gradle" -exec sed -i 's/compileSdkVersion 3[0-5]/compileSdkVersion 36/g; s/compileSdk 3[0-5]/compileSdk 36/g; s/compileSdk = 3[0-5]/compileSdk = 36/g' {} +

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: SquadVoice-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    name: Build iPhone 8 Plus iOS IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Regenerate fresh iOS Podfile & set iOS 13.0 target for iPhone 8 Plus
        run: |
          rm -f test/widget_test.dart
          rm -f ios/Podfile ios/Podfile.lock
          flutter pub get
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/g' ios/Runner.xcodeproj/project.pbxproj
          if [ -f ios/Podfile ]; then
            sed -i '' "s/# platform :ios, '[0-9.]*'/platform :ios, '13.0'/g" ios/Podfile
            sed -i '' "s/platform :ios, '[0-9.]*'/platform :ios, '13.0'/g" ios/Podfile
          fi

      - name: Build unsigned iOS App (SideStore / AltStore / Sideloadly)
        run: |
          flutter build ios --release --no-codesign
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r SquadVoice_iOS16.ipa Payload

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: SquadVoice-iOS16-IPA
          path: SquadVoice_iOS16.ipa